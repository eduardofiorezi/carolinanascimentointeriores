<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">
    <img src="{{ '/assets/logo-white.png' | relative_url }}" width="460" height="278" alt="Carolina Nascimento Interiores">
  </a>

  <button type="button" id="menu-trigger" aria-expanded="false" aria-controls="site-navigation">Menu</button>

  <nav class="header-entry" id="site-navigation" aria-label="Navegação principal">
    <ul class="main-nav">
      <li><a href="{{ '/' | relative_url }}"{% if page.active == 'index' %} class="active-link" aria-current="page"{% endif %}>Início</a></li>
      <li><a href="{{ '/perfil.html' | relative_url }}"{% if page.active == 'perfil' %} class="active-link" aria-current="page"{% endif %}>Perfil</a></li>
      <li><a href="{{ '/como-trabalhamos.html' | relative_url }}"{% if page.active == 'como-trabalhamos' %} class="active-link" aria-current="page"{% endif %}>Como trabalhamos</a></li>
      <li><a href="{{ '/portfolio.html' | relative_url }}"{% if page.active == 'portfolio' %} class="active-link" aria-current="page"{% elsif page.layout == 'project' %} class="active-link" aria-current="location"{% endif %}>Portfólio</a></li>
      <li><a href="{{ '/imprensa.html' | relative_url }}"{% if page.active == 'imprensa' %} class="active-link" aria-current="page"{% endif %}>Imprensa</a></li>
    </ul>

    <div class="social">
      <a href="{{ site.data.contact.whatsapp_url }}" target="_blank" rel="noopener" aria-label="WhatsApp de Carolina Nascimento, {{ site.data.contact.whatsapp_display }}">
        <img src="{{ '/assets/whatsapp.svg' | relative_url }}" width="30" height="30" alt="">WhatsApp
      </a>
      <a href="https://www.instagram.com/carolina.nascimento.interiores/" target="_blank" rel="noopener"><span class="instagram" aria-hidden="true"></span>Instagram</a>
    </div>
  </nav>
</header>
