---
layout: default
---
{% assign project = site.data.projects | where: 'url', page.url | first %}
<div class="entry">
  <div class="portfolio-gallery">
    <h1>{{ project.name | escape }}</h1>
    <div class="gallery-bottom">
      <div class="bxslider">
        {% for photo in project.photos %}
        <img src="{{ photo.src | relative_url }}" alt="{{ photo.alt | escape }}" width="{{ photo.width }}" height="{{ photo.height }}">
        {% endfor %}
      </div>
      <a class="back" href="{{ '/portfolio.html' | relative_url }}">Voltar ao portfólio</a>
    </div>
  </div>
</div>
